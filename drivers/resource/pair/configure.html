<form class="homey-form">
  <label class="homey-form-label">Controllerens URL <input class="homey-form-input" name="url" type="url" placeholder="http://192.168.1.3" required></label>
  <label class="homey-form-label">Brugernavn <input class="homey-form-input" name="user" required></label>
  <label class="homey-form-label">Adgangskode <input class="homey-form-input" name="pass" type="password" required></label>
  <label><input type="checkbox" name="manual"> Tilføj manuelt via ressource-id</label>
  <fieldset hidden>
    <label>Navn <input name="name"></label>
    <label>Ressource-id <input name="resource" placeholder="12345 eller _0x3039"></label>
    <label>Type <select name="kind">
      <option value="light">Lys</option><option value="dimmer">Lysdæmper</option><option value="switch">Kontakt/relæ</option>
      <option value="contact">Åbningssensor</option><option value="motion">Bevægelse</option><option value="smoke">Røg</option>
      <option value="moisture">Vand</option><option value="binary">Binær sensor</option><option value="temperature">Temperatur</option>
      <option value="humidity">Luftfugtighed</option><option value="lux">Lysstyrke (lux)</option><option value="number">Talværdi</option>
    </select></label>
    <label><input name="invert" type="checkbox"> Invertér binær sensor</label>
    <label>Separat tænd-id (valgfrit) <input name="on"></label>
    <label>Separat sluk-id (valgfrit) <input name="off"></label>
  </fieldset>
  <button class="homey-button-primary-full">Hent enheder</button>
  <p role="status"></p>
</form>
<script>
const f = document.querySelector('form'), status = f.querySelector('[role=status]');
f.elements.manual.onchange = () => { f.querySelector('fieldset').hidden = !f.elements.manual.checked; };
f.onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  data.manual = f.elements.manual.checked; data.invert = f.elements.invert.checked;
  f.querySelector('button').disabled = true; status.textContent = 'Læser fra controlleren …';
  try {
    const count = await Homey.emit('configure', data);
    if (count) await Homey.showView('list_devices');
    else status.textContent = 'Ingen kendte produkter fundet. Prøv manuel tilføjelse.';
  } catch (error) { status.textContent = error.message || String(error); }
  finally { f.querySelector('button').disabled = false; }
};
</script>
